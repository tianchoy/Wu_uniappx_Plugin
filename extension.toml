id = "uniappx"
name = "uni-app x (UVue)"
version = "1.2.0"
schema_version = 1
description = "uni-app x .uvue syntax highlighting with UTS script injection."
authors = ["tianchoy"]
repository = "https://github.com/tianchoy/Wu_uniappx_Plugin"

languages = ["languages/uvue"]

# The grammar name must be "vue": the WASM exports tree_sitter_vue.
# Zed compiles this grammar from repository/rev; local/dev installs use the bundled grammars/vue.wasm.
[grammars.vue]
repository = "https://github.com/tree-sitter-grammars/tree-sitter-vue"
rev = "7e48557b903a9db9c38cea3b7839ef7e1f36c693"
